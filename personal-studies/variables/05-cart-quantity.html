<!doctype html>
<html>
  <head>
    <title>cart Quantity</title>
  </head>
  <body>
    <!--Projeto simples, mas útil pra fixar manipulação de variáveis e atualização de estado no JavaScript.-->
    <button onclick="
      console.log(`Cart quantity: ${cartQuantity}
      `);  
    ">show Quantity</button>

    <button onclick="
      cartQuantity++; 
      console.log(`Cart quantity: ${cartQuantity}
      `); 
    ">Add to Cart</button>

    <button onclick="
      cartQuantity += 2;
      console.log(`Cart quantity: ${cartQuantity}
      `); 
    ">+2</button>
    <!--Usei onclick diretamente no HTML pra entender melhor como eventos alteram variáveis em tempo real.-->
    <button onclick="
      cartQuantity = cartQuantity + 3;
      console.log(`Cart quantity: ${cartQuantity}
      `);
    ">+3</button>

    <button onclick="
      cartQuantity = 0;
      console.log('Cart was reset.');
    ">Reset Card</button>

    <script>
      let cartQuantity = 0;
    </script>
    <!--Pratiquei template literals e atualização dinâmica de valores usando JavaScript puro, sem biblioteca-->
  </body>
</html>
