<!doctype html>
<html>
  <head>
    <title>variables</title>
  </head>
  <body>
    <script>
      // let permite criar variáveis que podem ter seus valores alterados durante a execução do código.
      let variable1 = 3;
      console.log(variable1);

      const calculation = 2 + 2;
      console.log(calculation);
      console.log(calculation + 2);

      const result = calculation + 2;
      console.log(result);

      const message = 'hello';
      console.log(message);

      variable1 = 5;
      console.log(variable1);

      variable1 = variable1 + 1;
      console.log(variable1);

      const variable2 = 3;
      var variable3 = 3;

      //typeof usado para verificar a procedência da variavel 
      console.log(typeof variable2);
      console.log(typeof message);
    </script>
  </body>
</html>
